<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPLIT-FLAP OS — Sub-Navigation Redesign</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root, [data-theme="light"] {
      --sf-bg-canvas: #f4f6f8;
      --sf-bg-panel: #ffffff;
      --sf-bg-recessed: #f1f3f5;
      --sf-bg-input: #f9fafb;
      --sf-border: #e2e6ea;
      --sf-text-primary: #111827;
      --sf-text-secondary: #4b5563;
      --sf-text-muted: #6b7280;
      --sf-accent: #0095c8;
      --sf-accent-soft: rgba(0, 149, 200, 0.10);
      --sf-accent-glow: rgba(0, 149, 200, 0.25);
    }

    [data-theme="dark"] {
      --sf-bg-canvas: #0c0e12;
      --sf-bg-panel: #15181e;
      --sf-bg-recessed: #0f1116;
      --sf-bg-input: #0a0b0e;
      --sf-border: #252a34;
      --sf-text-primary: #f3f4f6;
      --sf-text-secondary: #9ca3af;
      --sf-text-muted: #6b7280;
      --sf-accent: #00a2d8;
      --sf-accent-soft: rgba(0, 162, 216, 0.14);
      --sf-accent-glow: rgba(0, 162, 216, 0.30);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 18px 16px 40px;
      font-family: 'Inter', sans-serif;
      background: var(--sf-bg-canvas);
      color: var(--sf-text-primary);
    }

    .sf-container {
      max-width: 1040px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── LEVEL 1: PRIMARY PILL TABS (UNCHANGED) ── */
    .sf-tabs {
      background: var(--sf-bg-panel);
      border: 1px solid var(--sf-border);
      border-radius: 13px;
      padding: 4px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }

    .sf-tab {
      border: none;
      background: transparent;
      color: var(--sf-text-secondary);
      padding: 9px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .sf-tab.active {
      background: var(--sf-accent);
      color: #fff;
      box-shadow: 0 2px 10px var(--sf-accent-glow);
    }

    /* ── SETTINGS CARD CONTAINER ── */
    .sf-panel {
      background: var(--sf-bg-panel);
      border: 1px solid var(--sf-border);
      border-radius: 16px;
      overflow: hidden;
    }

    /* ── LEVEL 2: UNDERLINE SUB-TABS + SAVE ACTION IN HEADER ── */
    .sf-subnav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 20px;
      border-bottom: 1px solid var(--sf-border);
      background: var(--sf-bg-recessed);
      flex-wrap: wrap;
    }

    .sf-subtabs {
      display: flex;
      align-items: center;
      gap: 22px;
      overflow-x: auto;
    }

    .sf-subtab {
      position: relative;
      border: none;
      background: transparent;
      color: var(--sf-text-secondary);
      padding: 15px 2px;
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.15s ease;
    }

    .sf-subtab:hover {
      color: var(--sf-text-primary);
    }

    .sf-subtab.active {
      color: var(--sf-accent);
    }

    .sf-subtab.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2.5px;
      border-radius: 2px 2px 0 0;
      background: var(--sf-accent);
    }

    .sf-save-btn {
      height: 34px;
      padding: 0 15px;
      border-radius: 9px;
      border: none;
      background: var(--sf-accent);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 2px 8px var(--sf-accent-glow);
    }

    /* ── LEVEL 3: MASTER-DETAIL APP SETTINGS SPLIT ── */
    .sf-split-body {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: 320px;
    }

    @media (max-width: 700px) {
      .sf-split-body { grid-template-columns: 1fr; }
    }

    .sf-app-sidebar {
      border-right: 1px solid var(--sf-border);
      background: var(--sf-bg-recessed);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    @media (max-width: 700px) {
      .sf-app-sidebar {
        border-right: none;
        border-bottom: 1px solid var(--sf-border);
        flex-direction: row;
        overflow-x: auto;
      }
    }

    .sf-app-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 9px 12px;
      border: 1px solid transparent;
      border-radius: 9px;
      background: transparent;
      color: var(--sf-text-secondary);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.14s ease;
    }

    .sf-app-item:hover:not(.active) {
      background: rgba(255, 255, 255, 0.04);
      color: var(--sf-text-primary);
    }

    .sf-app-item.active {
      background: var(--sf-accent-soft);
      color: var(--sf-accent);
      border-color: rgba(0, 162, 216, 0.28);
    }

    .sf-app-icon {
      width: 18px;
      text-align: center;
      font-size: 14px;
    }

    /* Right Form Pane */
    .sf-form-pane {
      padding: 22px 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .sf-pane-header {
      border-bottom: 1px solid var(--sf-border);
      padding-bottom: 12px;
    }

    .sf-pane-title {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
    }

    .sf-pane-desc {
      margin: 4px 0 0;
      font-size: 12px;
      color: var(--sf-text-secondary);
    }

    .sf-field {
      display: flex;
      flex-direction: column;
      gap: 7px;
      max-width: 460px;
    }

    .sf-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--sf-text-secondary);
    }

    .sf-select {
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--sf-border);
      background: var(--sf-bg-input);
      padding: 0 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--sf-text-primary);
    }
  </style>
</head>
<body>
  <div class="sf-container">
    <!-- Level 1: Primary Tabs -->
    <nav class="sf-tabs">
      <button class="sf-tab">CONTROL</button>
      <button class="sf-tab">PLAYLISTS</button>
      <button class="sf-tab">APPS</button>
      <button class="sf-tab">TUNING</button>
      <button class="sf-tab active">SETTINGS</button>
    </nav>

    <!-- Settings Panel -->
    <section class="sf-panel">
      <!-- Level 2: Clean Underline Sub-Tabs + Save Button -->
      <div class="sf-subnav-bar">
        <div class="sf-subtabs">
          <button class="sf-subtab" onclick="setSub(this)">DISPLAY</button>
          <button class="sf-subtab active" onclick="setSub(this)">APPS</button>
          <button class="sf-subtab" onclick="setSub(this)">LAYOUT</button>
          <button class="sf-subtab" onclick="setSub(this)">DRUMS</button>
          <button class="sf-subtab" onclick="setSub(this)">SYSTEM</button>
        </div>
        <button class="sf-save-btn">SAVE SETTINGS</button>
      </div>

      <!-- Level 3: Vertical App Rail + Config Form -->
      <div class="sf-split-body">
        <aside class="sf-app-sidebar">
          <button class="sf-app-item" onclick="setApp(this, 'Animations')"><span class="sf-app-icon">🌈</span>Animations</button>
          <button class="sf-app-item" onclick="setApp(this, 'Clock')"><span class="sf-app-icon">⏱️</span>Clock</button>
          <button class="sf-app-item" onclick="setApp(this, 'Countdown')"><span class="sf-app-icon">⏳</span>Countdown</button>
          <button class="sf-app-item" onclick="setApp(this, 'Crypto')"><span class="sf-app-icon">₿</span>Crypto</button>
          <button class="sf-app-item active" onclick="setApp(this, 'Dashboard')"><span class="sf-app-icon">🏠</span>Dashboard</button>
          <button class="sf-app-item" onclick="setApp(this, 'Date')"><span class="sf-app-icon">📅</span>Date</button>
          <button class="sf-app-item" onclick="setApp(this, 'Metro')"><span class="sf-app-icon">🚇</span>Metro</button>
          <button class="sf-app-item" onclick="setApp(this, 'Sports')"><span class="sf-app-icon">🏒</span>Sports</button>
          <button class="sf-app-item" onclick="setApp(this, 'Stocks')"><span class="sf-app-icon">📈</span>Stocks</button>
          <button class="sf-app-item" onclick="setApp(this, 'Weather')"><span class="sf-app-icon">🌤️</span>Weather</button>
          <button class="sf-app-item" onclick="setApp(this, 'World Clock')"><span class="sf-app-icon">🌍</span>World Clock</button>
        </aside>

        <div class="sf-form-pane">
          <div class="sf-pane-header">
            <h3 class="sf-pane-title" id="appTitle">Dashboard Settings</h3>
            <p class="sf-pane-desc">Configure combined time and weather display formatting.</p>
          </div>

          <div class="sf-field">
            <label class="sf-label">Clock format</label>
            <select class="sf-select">
              <option>12 h</option>
              <option selected>24 h</option>
            </select>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script>
    function setSub(btn) {
      document.querySelectorAll('.sf-subtab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
    function setApp(btn, name) {
      document.querySelectorAll('.sf-app-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('appTitle').textContent = `${name} Settings`;
    }
  </script>
</body>
</html>
