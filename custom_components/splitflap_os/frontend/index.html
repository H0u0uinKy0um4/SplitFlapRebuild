<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SplitFlap OS</title>
  <link rel="stylesheet" href="/hacsfiles/splitflap-os/frontend/styles.css">
</head>
<body>
  <div id="panel-root">
    <div id="app-container">
      <div id="status-bar" class="offline">
        <span><span class="dot"></span><span id="status-online-msg">Offline</span></span>
        <span class="mode"><span id="status-mode">idle</span></span>
        <span class="actions">
          <button id="btn-backups" type="button">Backups</button>
          <button id="btn-settings" type="button">Settings</button>
          <button id="btn-inspector" type="button">Hardware Inspector</button>
        </span>
      </div>

      <div id="status-msg" class="status"></div>

      <section id="board" class="section">
        <h2>Board</h2>
        <div id="flap-picker" class="preset-strip"></div>
        <div id="flap-preview" class="columns-8"></div>
      </section>

      <section id="apps" class="section">
        <h2>Available Apps</h2>
        <div id="app-list" class="card-grid medium-grid"></div>
      </section>

      <section id="playlists" class="section">
        <h2>Playlists</h2>
        <div id="playlist-list" class="card-grid medium-grid"></div>
      </section>

      <section id="settings" class="section hidden">
        <h2>Settings</h2>
        <div id="settings-tabs" class="settings-tabs"></div>
        <div id="settings-body"></div>
      </section>

      <section id="backups" class="section hidden">
        <h2>Backups</h2>
        <div id="backup-list" class="backups backup-list"></div>
      </section>

      <section id="hardware-inspector" class="section harware-inspector hidden">
        <h2>Hardware Inspector</h2>
        <div class="toolbar">
          <button id="inspector-sync-all">SYNC ALL</button>
          <button id="inspector-home-all">HOME ALL</button>
          <button id="inspector-auto-tune">AUTO FINE-TUNE</button>
          <button id="inspector-teach">TEACH MODE</button>
        </div>
        <div id="inspector-mod-grid" class="mod-grid"></div>
      </section>

      <section id="inspector-detail" class="section hidden">
        <h2>Module Inspector</h2>
        <div id="inspector-detail-body"></div>
      </section>

      <section id="character-map" class="section hidden">
        <h2>Character Map</h2>
        <div id="char-map-grid" class="char-map-grid"></div>
        <div id="char-map-preview" class="char-map-preview"></div>
        <div id="char-map-actions" class="char-map-actions"></div>
      </section>

      <section id="auto-fine-tune" class="section auto-fine-tune hidden">
        <h2>Auto Fine-Tune</h2>
        <div id="auto-tune-body"></div>
      </section>

      <section id="teach-mode" class="section teach-mode hidden">
        <h2>Teach Mode</h2>
        <div id="teach-body"></div>
      </section>
    </div>
  </div>

  <script type="module" src="/hacsfiles/splitflap-os/frontend/splitflap-os-panel.js?v=1.2.0"></script>
</body>
</html>
